# FTPS Uploader 設定檔

# FTPS 伺服器設定
host=192.168.27.22
port=8421
user=MLS.OP200
pass=CMAKE#96

# 上傳程式專用通訊協議設定
# false: 使用 FTP/FTPS（預設）
# true: 使用 SFTP（SSH File Transfer Protocol，通常 port=22）
use_sftp=false

# 目錄設定
# 遠端上傳目錄 (選填)
remote_dir=\CSTP96.$DATA.SKDATA91
# 本地讀取目錄
local_dir=./uploads
# 日誌檔目錄
log_dir=./logs

# TLS 設定
# use_sftp=false 時使用；此設定只影響上傳程式
# true  = 使用 FTPS
# false = 使用純文字 FTP
use_tls=true
use_implicit_tls=false
insecure_skip_verify=true

# SFTP 設定
# use_sftp=true 時使用；ssh_key_path 留空代表使用 pass 密碼登入
# 此設定只影響上傳程式，不會影響下載程式
ssh_key_path=
ssh_host_key_check=false

# 上傳時間限制 (選填)
# 格式: HH:mm-HH:mm
# 只有在指定時間範圍內且檔案存在時才會執行上傳
#allowed_time_range=00:00-23:59

# 要上傳的檔案清單
file_names.0.local_path=./uploads
file_names.0.files.0=test.txt:TEST
