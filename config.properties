# FTPS Downloader 設定檔

# FTPS 伺服器設定
host=192.168.27.22
port=8421
user=MLS.OP
pass=CMAKE



# 目錄設定
remote_dir=
#local_dir=./downloads
local_dir=C:/home/ftp
#log_dir=./logs
log_dir=C:/home/logs/ftps
# 顯示完整 LIST 輸出
debug_list=false          
# 停用 MLSD，強制使用 LIST（NonStop/Guardian 建議）
disable_mlsd=true
# 顯示編碼資訊
debug_encoding=false       
#為每個下載的檔案建立獨立的日誌檔案
separate_file_log=true	
# 保留 7 天
log_retention_days=7  



# 下載程式專用通訊協議設定
# 協議				設定方式	加密
#FTP			use_sftp=false + use_tls=false	無
#FTPS Explicit	use_sftp=false + use_tls=true + use_implicit_tls=false	TLS（目前你的設定）
#FTPS Implicit	use_sftp=false + use_tls=true + use_implicit_tls=true	TLS 全程
#SFTP			use_sftp=true	SSH



# 是否使用 SFTP（true = SFTP，false = FTP/FTPS）
# 此設定只影響下載程式，不會影響上傳程式
use_sftp=false

# SSH 私鑰路徑（留空則使用密碼認證）
ssh_key_path=

# 是否驗證 SSH 主機金鑰（false = 跳過驗證）
ssh_host_key_check=false


# TLS 設定
# TLS / 連線模式設定
# use_sftp=false 時使用；此設定只影響下載程式
# true  = 使用 FTPS（加密）
# false = 使用純文字 FTP（無加密）
use_tls=true
use_implicit_tls=false
insecure_skip_verify=true

#skip_header_bytes=-1
#1. 本地不存在 → 下載
#2. force_download=true → 下載（強制）
#3. skip_if_exists=true → 跳過
#4. 取得遠端時間 
#   ├─ 時間較新 → 下載
#   └─ 時間相同
#       ├─ compare_by_modtime=true → 跳過
#       └─ 預設 → 檢查大小，不同就下載
#5. 無時間資訊 → 用大小比對

#遠端時間較新 → 下載
#skip_if_exists=false
compare_by_modtime=true
#force_download=false
# 記錄檔案原始時間的資料夾
file_times_dir=./file_times


#現在程式預設就會偵測遠端檔案的時間變更，確保下載到最新的檔案

# ===== 結帳檔設定（DATCLOSE 機制）=====
# 結帳檔名稱
flag_file_name=DATCLOSE

# 結帳檔專用下載路徑（程式會先從這個路徑下載 DATCLOSE）
flag_file_path=\CSTP96.$DATA.SKWORK

# 下載完成後自動刪除 DATCLOSE（預設 true）
auto_delete_flag_file=true


monitor_mode=true 

#下次循環檢查時生效（最多等待當前的 check_interval 時間）
#如果 check_interval = 30 分鐘，最多等 30 分鐘
check_interval=1

stop_time=23:00

# Guardian/NonStop 系統通常使用 EBCDIC 編碼
guardian_add_crlf=true
raw_download=true
require_remote_metadata=true
debug_list=false


# 要下載的檔案清單
# 格式: file_names.路徑索引.remote_path=路徑
#       file_names.路徑索引.files.檔案索引=檔名

file_names.0.remote_path=\CSTP96.$DATA.SKWORK
#指定下載時間範圍
#file_names.0.allowed_time_range=08:00-20:00
#file_names.0.check_flag_file=true
#file_names.0.flag_file_name=DATCLOSE
#file_names.0.files.0=DATCLOSE



